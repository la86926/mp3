name: Construir copia independiente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-copy.yml'
      - 'aux-minimal.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Copiar aplicación funcional
        run: |
          curl -fsSL "https://raw.githubusercontent.com/la86926/splitter-mp3/main/splitter-app.html" -o splitter-app.html

      - name: Aplicar diseño AUX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('splitter-app.html')
          source = app.read_text(encoding='utf-8')
          stylesheet = '<link rel="stylesheet" href="./aux-minimal.css?v=20260731-aux">\n'
          if stylesheet not in source:
              source = source.replace('</head>', stylesheet + '</head>', 1)
          app.write_text(source, encoding='utf-8')

          Path('index.html').write_text('''<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <title>Splitter MP3</title>
            <style>
              html,body{margin:0;min-height:100%;background:#faf9fe;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              #loader{min-height:100vh;display:grid;place-items:center;color:#606166;font-size:14px}
              @media(prefers-color-scheme:dark){html,body{background:#101012}#loader{color:#b2b2b8}}
            </style>
          </head>
          <body>
            <div id="loader">Abriendo Splitter MP3…</div>
            <script>
            (async()=>{
              const response=await fetch('./splitter-app.html?v=20260731-aux',{cache:'no-store'});
              if(!response.ok)throw new Error('No se pudo cargar Splitter MP3.');
              const source=await response.text();
              document.open();document.write(source);document.close();
            })().catch(error=>{
              console.error(error);
              document.getElementById('loader').textContent='No se pudo abrir Splitter MP3. Recarga la página.';
            });
            </script>
          </body>
          </html>
          '''.replace('          ', ''), encoding='utf-8')
          PY

      - name: Guardar copia en MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html splitter-app.html
          if git diff --cached --quiet; then
            echo "La copia ya está actualizada."
          else
            git commit -m "Crear copia funcional con diseño AUX"
            git push
          fi
